<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stupidbot control panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>MeowMeowNya control panel</h1>
    <div id="status" class="status status-offline">offline</div>
</header>

<section class="controls do-command">
    <input id="server-host-input" type="text" placeholder="server host, e.g. play.skeletonmc.com">
    <input id="server-port-input" type="number" placeholder="port">
    <input id="server-username-input" type="text" placeholder="bot username">
    <input id="server-version-input" type="text" placeholder="minecraft version (blank = auto-detect)">
    <input id="server-hub-npc-input" type="text" placeholder="hub NPC name (optional)">
    <button id="save-server-btn" class="btn">Save Server</button>
</section>

<section class="controls">
    <button id="launch-btn" class="btn btn-start">Launch</button>
    <button id="shutdown-btn" class="btn btn-stop">Shutdown</button>
</section>

<section class="controls">
    <button class="btn" data-command="tpToMe">TP To Me</button>
    <button class="btn" data-command="tpMeToYou">TP Me To You</button>
    <button class="btn" data-command="enableTotemMode">Enable Totem Mode</button>
    <button class="btn" data-command="disableTotemMode">Disable Totem Mode</button>
    <button class="btn" data-command="dropItem">Drop Item</button>
    <button class="btn" data-command="offhand">Offhand</button>
    <button class="btn" data-command="walkToMe">Walk To Me</button>
    <button class="btn" data-command="stopWalking">Stop</button>
    <button class="btn" data-command="listEntities">List Nearby Entities</button>
</section>

<section class="controls">
    <label class="switch-label">
        <input type="checkbox" id="chat-games-toggle">
        <span class="switch"></span>
        Chat Games solver
    </label>
</section>

<section class="controls do-command">
    <input id="do-command-input" type="text" placeholder="command without leading slash, e.g. tpa SpeedStrafe04">
    <button id="do-command-btn" class="btn">Do Command</button>
</section>

<section class="controls do-command">
    <input id="say-input" type="text" placeholder="message to send to public chat">
    <button id="say-btn" class="btn">Say</button>
</section>

<section class="controls do-command">
    <input id="build-input" type="text" placeholder="schematic name and location, e.g. house at 100 64 200">
    <button id="build-btn" class="btn">Build</button>
</section>

<section class="controls do-command">
    <input id="gather-wood-input" type="number" min="1" placeholder="number of logs to gather">
    <button id="gather-wood-btn" class="btn">Gather Wood</button>
    <button id="stop-gather-wood-btn" class="btn">Stop</button>
</section>

<section class="panels">
    <div class="panel">
        <h2>Console</h2>
        <pre id="console-view"></pre>
    </div>
    <div class="panel">
        <h2>Log (errors.txt)</h2>
        <pre id="log-view"></pre>
    </div>
</section>

<script src="app.js"></script>
</body>
</html>
